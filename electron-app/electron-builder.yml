appId: com.scaleflow.app
productName: ScaleFlow
copyright: Copyright © 2025 ScaleFlow

directories:
  output: release
  buildResources: public

files:
  - dist
  - dist-electron

# Bundle ffmpeg-static binary so users don't need FFmpeg installed
extraResources:
  - from: "node_modules/ffmpeg-static/ffmpeg.exe"
    to: "ffmpeg.exe"
  - from: "node_modules/ffmpeg-static/ffmpeg"
    to: "ffmpeg"

asarUnpack:
  - "node_modules/ffmpeg-static/**"

# Windows — installeur NSIS (setup wizard classique)
win:
  target:
    - target: nsis
      arch: x64
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ScaleFlow-Setup-${version}.exe
  shortcutName: ScaleFlow
  uninstallDisplayName: ScaleFlow
  createDesktopShortcut: true
  createStartMenuShortcut: true

# macOS
mac:
  target: dmg
  artifactName: ScaleFlow-${version}.dmg

# Linux
linux:
  target: AppImage
  artifactName: ScaleFlow-${version}.AppImage
