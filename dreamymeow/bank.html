<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>dreamymeow — Banque</title>
<meta name="theme-color" content="#0A0B0E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/dm-ui.css" />
<script src="/vendor/supabase.js"></script>
<script src="/dm-auth.js"></script>
<style>
  .drop{border:2px dashed rgba(168,85,247,.42); border-radius:16px; padding:22px 16px; text-align:center; cursor:pointer; background:rgba(168,85,247,.05); transition:.15s}
  .drop.hot{background:rgba(168,85,247,.15); border-color:var(--acc)}
  .drop b{font-size:14px} .drop small{display:block; margin-top:5px; color:var(--dim); font-size:12px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px}
  .it{border-radius:14px; overflow:hidden; border:1px solid var(--edge); background:rgba(255,255,255,.02); display:flex; flex-direction:column}
  .pv{position:relative; aspect-ratio:4/5; background:#000; display:grid; place-items:center}
  .pv img,.pv video{width:100%; height:100%; object-fit:cover; display:block}
  .pv .k{position:absolute; top:8px; left:8px; font-size:10px; font-weight:800; padding:3px 7px; border-radius:6px; background:rgba(0,0,0,.6); color:#e9d5ff}
  .meta{padding:10px 11px 11px; display:flex; flex-direction:column; gap:6px}
  .nm{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ex{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color:var(--mut)}
  .life{height:3px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden}
  .life i{display:block; height:100%; border-radius:99px}
  .acts{display:flex; gap:6px}
  .acts .btn{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg></span>
    <h1 data-i="h1">Ma <span>banque</span></h1>
    <div class="right">
      <span class="brand">dreamymeow.com</span>
      <div class="lang" id="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
    </div>
  </header>

  <nav class="tabs">
    <a class="tab" href="/" data-i="tabImage">📷 Image</a>
    <a class="tab" href="/video" data-i="tabVideo">🎬 Vidéo</a>
    <a class="tab on" href="/bank" data-i="tabBank">☁ Banque</a>
  </nav>

  <div class="notice" id="keepInfo"></div>
  <div class="notice err" id="err" hidden></div>

  <div class="kpis">
    <div class="kpi"><b id="kCount">—</b><span data-i="kFiles">Fichiers</span></div>
    <div class="kpi"><b id="kSize">—</b><span data-i="kSize">Espace utilisé</span></div>
    <div class="kpi"><b id="kSoon">—</b><span data-i="kSoon">Expirent sous 24 h</span></div>
  </div>

  <div class="card">
    <div class="drop" id="drop" role="button" tabindex="0">
      <b data-i="dropB">Ajoute des fichiers à ta banque</b>
      <small data-i="dropS">Glisse des images ou vidéos ici, ou clique — conservées 7 jours</small>
      <input id="file" type="file" accept="image/*,video/*" multiple hidden />
    </div>
    <div id="upInfo" class="sub" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:14px">
      <div class="seg" id="filter">
        <button data-f="all" class="on" data-i="fAll">Tout</button>
        <button data-f="video" data-i="fVid">Vidéos</button>
        <button data-f="image" data-i="fImg">Images</button>
      </div>
      <button class="btn sm" id="reload" data-i="reload">Actualiser</button>
    </div>
    <div id="list"><div class="empty" data-i="loading">Chargement…</div></div>
  </div>

  <footer><a href="/" style="color:var(--acc);text-decoration:none" data-i="back">← Retour au spoofer</a></footer>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s)
  const I18N = {
    fr: {
      h1: 'Ma <span>banque</span>', tabImage: '📷 Image', tabVideo: '🎬 Vidéo', tabBank: '☁ Banque',
      keep: d => `Tes fichiers restent ${d} jours dans ta banque, puis sont supprimés automatiquement. Télécharge ceux que tu veux garder.`,
      kFiles: 'Fichiers', kSize: 'Espace utilisé', kSoon: 'Expirent sous 24 h',
      dropB: 'Ajoute des fichiers à ta banque', dropS: 'Glisse des images ou vidéos ici, ou clique — conservées 7 jours',
      fAll: 'Tout', fVid: 'Vidéos', fImg: 'Images', reload: 'Actualiser', loading: 'Chargement…', back: '← Retour au spoofer',
      empty: 'Ta banque est vide. Spoofe une image ou une vidéo puis clique « Banque » sur le résultat, ou ajoute des fichiers ci-dessus.',
      left: (d, h) => d > 0 ? `expire dans ${d} j ${h} h` : h > 0 ? `expire dans ${h} h` : 'expire bientôt',
      dl: 'Télécharger', del: 'Supprimer', confirmDel: n => `Supprimer « ${n} » de ta banque ?`,
      uploading: (i, n) => `Envoi ${i}/${n}…`, uploaded: n => `✓ ${n} fichier(s) ajouté(s)`, purged: n => `${n} fichier(s) expiré(s) supprimé(s).`,
      video: 'VIDÉO', image: 'IMAGE',
    },
    en: {
      h1: 'My <span>bank</span>', tabImage: '📷 Image', tabVideo: '🎬 Video', tabBank: '☁ Bank',
      keep: d => `Your files stay ${d} days in your bank, then are deleted automatically. Download the ones you want to keep.`,
      kFiles: 'Files', kSize: 'Storage used', kSoon: 'Expire within 24 h',
      dropB: 'Add files to your bank', dropS: 'Drop images or videos here, or click — kept 7 days',
      fAll: 'All', fVid: 'Videos', fImg: 'Images', reload: 'Refresh', loading: 'Loading…', back: '← Back to the spoofer',
      empty: 'Your bank is empty. Spoof an image or a video then click “Bank” on the result, or add files above.',
      left: (d, h) => d > 0 ? `expires in ${d} d ${h} h` : h > 0 ? `expires in ${h} h` : 'expires soon',
      dl: 'Download', del: 'Delete', confirmDel: n => `Delete “${n}” from your bank?`,
      uploading: (i, n) => `Uploading ${i}/${n}…`, uploaded: n => `✓ ${n} file(s) added`, purged: n => `${n} expired file(s) deleted.`,
      video: 'VIDEO', image: 'IMAGE',
    },
  }
  let LANG = (() => { try { return localStorage.getItem('dreamymeow-lang') } catch (_) { return null } })() || ((navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en')
  const tr = k => I18N[LANG][k] ?? I18N.fr[k] ?? k
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const mb = b => b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' Go' : (b / 1048576).toFixed(1) + ' Mo'

  let rows = [], filter = 'all', urls = new Map()
  function applyLang() {
    document.documentElement.lang = LANG
    document.querySelectorAll('[data-i]').forEach(el => { const v = tr(el.dataset.i); if (typeof v === 'string') el.innerHTML = v })
    $('#keepInfo').textContent = tr('keep')(window.dm ? dm.KEEP_DAYS : 7)
    document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG))
    window.dispatchEvent(new Event('dm-lang'))
    render()
  }
  $('#lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LANG = b.dataset.l; try { localStorage.setItem('dreamymeow-lang', LANG) } catch (_) {} applyLang() })
  $('#filter').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; [...$('#filter').children].forEach(x => x.classList.toggle('on', x === b)); render() })
  $('#reload').addEventListener('click', () => load())

  function showErr(m) { const e = $('#err'); e.hidden = !m; e.textContent = m || '' }

  function render() {
    const total = rows.reduce((s, r) => s + Number(r.size || 0), 0)
    $('#kCount').textContent = rows.length
    $('#kSize').textContent = mb(total)
    $('#kSoon').textContent = rows.filter(r => new Date(r.expires_at) - Date.now() < 86400000).length
    const shown = rows.filter(r => filter === 'all' || r.kind === filter)
    if (!shown.length) { $('#list').innerHTML = `<div class="empty">${tr('empty')}</div>`; return }
    $('#list').innerHTML = '<div class="grid">' + shown.map(r => {
      const ms = Math.max(0, new Date(r.expires_at) - Date.now())
      const d = Math.floor(ms / 86400000), h = Math.floor((ms % 86400000) / 3600000)
      const pct = Math.min(100, ms / (7 * 86400000) * 100)
      const col = pct > 40 ? 'var(--ok)' : pct > 14 ? 'var(--warn)' : 'var(--bad)'
      const u = urls.get(r.path)
      const media = !u ? '' : r.kind === 'video'
        ? `<video src="${esc(u)}#t=0.1" muted playsinline preload="metadata"></video>`
        : `<img src="${esc(u)}" alt="" loading="lazy" decoding="async">`
      return `<div class="it" data-id="${r.id}">
        <div class="pv">${media}<span class="k">${tr(r.kind)}</span></div>
        <div class="meta">
          <div class="nm" title="${esc(r.name)}">${esc(r.name)}</div>
          <div class="ex"><span>${tr('left')(d, h)}</span><span>${mb(Number(r.size || 0))}</span></div>
          <div class="life"><i style="width:${pct}%;background:${col}"></i></div>
          <div class="acts"><button class="btn sm" data-dl>${tr('dl')}</button><button class="btn sm bad" data-del>${tr('del')}</button></div>
        </div></div>`
    }).join('') + '</div>'
  }

  $('#list').addEventListener('click', async e => {
    const card = e.target.closest('.it'); if (!card) return
    const r = rows.find(x => x.id === card.dataset.id); if (!r) return
    if (e.target.closest('[data-dl]')) {
      try { const u = await dm.bank.url(r, true); const a = document.createElement('a'); a.href = u; a.download = r.name; document.body.appendChild(a); a.click(); a.remove() }
      catch (x) { showErr(x.message) }
    }
    if (e.target.closest('[data-del]')) {
      if (!confirm(tr('confirmDel')(r.name))) return
      try { await dm.bank.remove(r); rows = rows.filter(x => x.id !== r.id); render() } catch (x) { showErr(x.message) }
    }
  })

  async function load() {
    showErr('')
    try {
      const purged = await dm.bank.purgeExpired().catch(() => 0)
      rows = await dm.bank.list()
      // URL signées en un seul appel pour toute la page.
      urls = new Map()
      if (rows.length) {
        const { data } = await dm.sb.storage.from('dreamymeow').createSignedUrls(rows.map(r => r.path), 3600)
        ;(data || []).forEach(x => { if (x.signedUrl) urls.set(x.path, x.signedUrl) })
      }
      render()
      if (purged) $('#upInfo').textContent = tr('purged')(purged)
    } catch (x) { showErr(x.message); $('#list').innerHTML = '' }
  }

  // Ajout direct de fichiers
  const drop = $('#drop'), input = $('#file')
  drop.addEventListener('click', () => input.click())
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click() } })
  ;['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot') }))
  ;['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot') }))
  drop.addEventListener('drop', e => upload([...(e.dataTransfer?.files || [])]))
  input.addEventListener('change', () => { upload([...input.files]); input.value = '' })
  async function upload(files) {
    files = files.filter(f => /^(image|video)\//.test(f.type))
    if (!files.length) return
    let ok = 0
    for (let i = 0; i < files.length; i++) {
      $('#upInfo').textContent = tr('uploading')(i + 1, files.length)
      try { await dm.bank.save(files[i], files[i].name, files[i].type.startsWith('video') ? 'video' : 'image'); ok++ }
      catch (x) { showErr(`${files[i].name} : ${x.message}`) }
    }
    $('#upInfo').textContent = tr('uploaded')(ok)
    load()
  }

  applyLang()
  dm.gate().then(() => {
    if (!dm.installed) { showErr('Le système de comptes n\'est pas encore installé (script SQL à appliquer dans Supabase).'); $('#list').innerHTML = ''; return }
    load()
  })
})()
</script>
</body>
</html>
