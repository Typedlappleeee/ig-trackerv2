<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScaleFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0;background:#0B0B0F;height:100%;overflow:hidden;}
  body{font-family:'Manrope',system-ui,sans-serif;color:#F4F4F6;-webkit-font-smoothing:antialiased;}
  #root{height:100%;}
  button,input{font-family:inherit;}
  ::selection{background:rgba(139,92,246,0.35);}
  *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.14) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.11);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes aIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes aPulse{0%,100%{opacity:1}50%{opacity:.32}}
  @keyframes aSpin{to{transform:rotate(360deg)}}
  @keyframes aBeat{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  @keyframes aPop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  /* ── Blowsome premium ──────────────────────────────────────────────── */
  @keyframes bRise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes bShine{to{background-position:200% center}}
  @keyframes bFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes bGlow{0%,100%{box-shadow:0 12px 30px -12px rgba(168,85,247,.85)}50%{box-shadow:0 18px 48px -10px rgba(236,72,153,.75)}}
  .blow-stagger>*{animation:bRise .55s cubic-bezier(0.16,1,0.3,1) both}
  .blow-stagger>*:nth-child(1){animation-delay:.04s}.blow-stagger>*:nth-child(2){animation-delay:.09s}
  .blow-stagger>*:nth-child(3){animation-delay:.14s}.blow-stagger>*:nth-child(4){animation-delay:.19s}
  .blow-stagger>*:nth-child(5){animation-delay:.24s}.blow-stagger>*:nth-child(6){animation-delay:.29s}
  .blow-stagger>*:nth-child(n+7){animation-delay:.33s}
  .blow-card{transition:transform .24s cubic-bezier(0.16,1,0.3,1),border-color .24s ease,box-shadow .24s ease;position:relative;overflow:hidden}
  .blow-card:hover{transform:translateY(-4px);border-color:rgba(168,85,247,.55)!important;box-shadow:0 26px 60px -26px rgba(168,85,247,.75)}
  .blow-card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.08) 48%,transparent 64%);transform:translateX(-130%);transition:transform .65s ease;pointer-events:none}
  .blow-card:hover::after{transform:translateX(130%)}
  .blow-cta{transition:transform .16s ease,box-shadow .3s ease}
  .blow-cta:hover{transform:translateY(-2px);animation:bGlow 1.9s ease-in-out infinite}
  .blow-cta:active{transform:translateY(0) scale(.97)}
  .blow-shine{background-size:200% auto;animation:bShine 4.5s linear infinite}
  .blow-float{animation:bFloat 6.5s ease-in-out infinite}
  .blow-tap{transition:transform .12s ease}
  .blow-tap:active{transform:scale(.95)}
  .blow-prog{background-size:200% 100%;animation:bShine 1.1s linear infinite}
  @media (prefers-reduced-motion: reduce){.blow-stagger>*,.blow-card,.blow-card::after,.blow-cta,.blow-shine,.blow-float,.blow-prog{animation:none!important;transition:none!important}}
  [data-rows]>*{animation:aIn .34s cubic-bezier(0.16,1,0.3,1) both}
  [data-rows]>*:nth-child(1){animation-delay:.01s}[data-rows]>*:nth-child(2){animation-delay:.03s}
  [data-rows]>*:nth-child(3){animation-delay:.05s}[data-rows]>*:nth-child(4){animation-delay:.07s}
  [data-rows]>*:nth-child(5){animation-delay:.09s}[data-rows]>*:nth-child(6){animation-delay:.11s}
  [data-rows]>*:nth-child(7){animation-delay:.13s}[data-rows]>*:nth-child(8){animation-delay:.15s}
  [data-rows]>*:nth-child(n+9){animation-delay:.17s}
  @media (prefers-reduced-motion: reduce){[data-rows]>*{animation:none}}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
